<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Molly's Home Guide</title>
<meta name="description" content="Everything our guests need: Wi-Fi, Molly the cat, plants, cleaning and garbage days. / Tout pour nos invités.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fbf5ec;
  --card: #ffffff;
  --ink: #2d2a26;
  --muted: #6f675d;
  --line: #ece2d3;
  --terracotta: #d9714e;
  --sage: #7fa37a;
  --mustard: #e3b23c;
  --sky: #6aa6c8;
  --plum: #a77bb5;
  --soft-terracotta: #fbe6dd;
  --soft-sage: #e5efe2;
  --soft-mustard: #fbf0d3;
  --soft-sky: #e0eef6;
  --soft-plum: #f1e7f4;
  --shadow: 0 2px 0 rgba(45,42,38,.06), 0 8px 24px rgba(45,42,38,.06);
  --todo-bg: #fff3b0;
  --todo-ink: #6b5400;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1a17; --card: #282420; --ink: #f3ece2; --muted: #b3a999; --line: #3a342e;
    --soft-terracotta: #3d2a22; --soft-sage: #26332a; --soft-mustard: #3a3220; --soft-sky: #22313a; --soft-plum: #33283a;
    --shadow: 0 2px 0 rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.25);
    --todo-bg: #4a3f10; --todo-ink: #ffe680;
  }
}
:root[data-theme="dark"] {
  --bg: #1d1a17; --card: #282420; --ink: #f3ece2; --muted: #b3a999; --line: #3a342e;
  --soft-terracotta: #3d2a22; --soft-sage: #26332a; --soft-mustard: #3a3220; --soft-sky: #22313a; --soft-plum: #33283a;
  --shadow: 0 2px 0 rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.25);
  --todo-bg: #4a3f10; --todo-ink: #ffe680;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 76px; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.55 "Nunito", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: "Fredoka", "Nunito", sans-serif; line-height: 1.15; margin: 0; }
a { color: var(--terracotta); }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }

/* top nav */
.nav {
  position: sticky; top: 0; z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.navbar { display: flex; gap: 8px; align-items: center; padding-top: 10px; padding-bottom: 10px; }
.links { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.links::-webkit-scrollbar { display: none; }
.lang { display: flex; flex: none; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.lang button { padding: 5px 10px; font-size: 13px; background: transparent; color: var(--ink); }
.lang button[aria-pressed="true"] { background: var(--terracotta); color: #fff; }
.nav a {
  flex: none; text-decoration: none; color: var(--ink); font-weight: 700; font-size: 14px;
  padding: 7px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line);
  white-space: nowrap;
}
.nav a:hover { border-color: var(--terracotta); }

/* hero */
.hero { padding: 28px 0 8px; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; }
.hero .hi { font-size: 15px; font-weight: 700; color: var(--terracotta); letter-spacing: .02em; }
.hero h1 { font-size: clamp(30px, 8vw, 46px); margin: 4px 0 8px; }
.hero p { margin: 0; color: var(--muted); max-width: 46ch; }
.cat-svg { width: 116px; height: auto; }
.cat-svg .tail { transform-origin: 78px 92px; animation: wag 2.6s ease-in-out infinite; }
.cat-svg .eye { transform-origin: center; transform-box: fill-box; animation: blink 5s infinite; }
@keyframes wag { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(14deg); } }
@keyframes blink { 0%,94%,100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
@media (prefers-reduced-motion: reduce) { .cat-svg .tail, .cat-svg .eye { animation: none; } }

/* today panel */
.today {
  margin: 18px 0 8px; background: var(--ink); color: var(--bg);
  border-radius: 22px; padding: 18px; box-shadow: var(--shadow);
}
.today h2 { font-size: 20px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.today h2 small { font-family: "Nunito"; font-weight: 600; font-size: 14px; opacity: .7; }
.today ul { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.today li { display: flex; gap: 10px; align-items: flex-start; background: color-mix(in srgb, var(--bg) 12%, transparent); border-radius: 14px; padding: 10px 12px; }
.today li .e { font-size: 20px; line-height: 1.2; }
.today li b { display: block; }
.today li span.s { opacity: .75; font-size: 14px; }

/* quick tiles */
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 18px 0 6px; }
@media (max-width: 520px) { .tiles { grid-template-columns: repeat(4, 1fr); gap: 8px; } }
.tile {
  text-decoration: none; color: var(--ink); background: var(--card); border: 1px solid var(--line);
  border-radius: 18px; padding: 12px 4px; text-align: center; box-shadow: var(--shadow);
  transition: transform .15s ease;
}
.tile:hover { transform: translateY(-2px); }
.tile .e { font-size: 28px; display: block; }
.tile span { font-size: 13px; font-weight: 700; }

/* sections */
section.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 24px;
  padding: 20px; margin: 18px 0; box-shadow: var(--shadow);
}
.sec-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.badge { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 24px; flex: none; }
.sec-head h2 { font-size: 24px; }
.sec-head p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.t-terracotta .badge { background: var(--soft-terracotta); }
.t-sage .badge { background: var(--soft-sage); }
.t-mustard .badge { background: var(--soft-mustard); }
.t-sky .badge { background: var(--soft-sky); }
.t-plum .badge { background: var(--soft-plum); }

h3 { font-size: 17px; margin: 18px 0 8px; }
.list { margin: 0; padding-left: 20px; }
.list li { margin: 4px 0; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; }
.kv dt { color: var(--muted); font-weight: 600; }
.kv dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
.note { background: var(--soft-mustard); border-radius: 14px; padding: 10px 14px; margin: 12px 0 0; font-size: 15px; }
.warn { background: var(--soft-terracotta); }

/* wifi */
.wifi { display: grid; gap: 10px; }
.wifi-row {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  background: var(--soft-sky); border-radius: 16px; padding: 12px 14px;
}
.wifi-row .lbl { font-size: 13px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.wifi-row .val { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 18px; font-weight: 700; overflow-wrap: anywhere; }
button {
  font: inherit; font-weight: 700; cursor: pointer; border: 0; border-radius: 999px;
  padding: 9px 14px; background: var(--ink); color: var(--bg); flex: none;
}
button:active { transform: scale(.97); }

/* meals timeline */
.meals { display: grid; gap: 10px; }
.meal {
  display: grid; grid-template-columns: 74px 1fr; gap: 12px; align-items: center;
  border: 1px solid var(--line); border-radius: 16px; padding: 12px;
}
.meal.next { border-color: var(--terracotta); background: var(--soft-terracotta); }
.meal .time { font-family: "Fredoka"; font-size: 22px; font-weight: 600; text-align: center; }
.meal b { display: block; }
.meal .what { color: var(--muted); font-size: 15px; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--terracotta); color: #fff; margin-left: 6px; vertical-align: 2px; }

/* checklist */
.check { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.check label {
  display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 14px;
  padding: 10px 12px; cursor: pointer; user-select: none;
}
.check input { width: 22px; height: 22px; accent-color: var(--sage); flex: none; }
.check input:checked + span { text-decoration: line-through; color: var(--muted); }
.progress { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; margin: 10px 0 4px; }
.progress div { height: 100%; width: 0; background: var(--sage); transition: width .3s ease; }
.progress-txt { font-size: 14px; color: var(--muted); }

/* grids of small cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.mini { border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.mini .e { font-size: 26px; }
.mini b { display: block; margin-top: 2px; }
.mini p { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.chip { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--soft-sage); }
.chip.on { background: var(--sage); color: #fff; }

/* garbage */
.bins { display: grid; gap: 10px; }
.bin { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
.bin .dot { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; font-size: 24px; }
.bin .when { text-align: right; font-weight: 700; font-size: 14px; }
.bin .when small { display: block; color: var(--muted); font-weight: 600; }
.bin.soon { border-color: var(--mustard); background: var(--soft-mustard); }

/* contacts */
.contact { display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.contact + .contact { margin-top: 8px; }
.contact small { display: block; color: var(--muted); }
.contact a.btn { text-decoration: none; background: var(--sage); color: #fff; border-radius: 999px; padding: 8px 14px; font-weight: 700; flex: none; }

.todo { background: var(--todo-bg); color: var(--todo-ink); border-radius: 6px; padding: 0 4px; font-weight: 700; }

footer { text-align: center; color: var(--muted); padding: 24px 0 48px; font-size: 14px; }
footer button { background: transparent; color: var(--muted); border: 1px solid var(--line); margin-top: 8px; }

.toast {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(80px);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 700;
  transition: transform .25s ease; z-index: 20;
}
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>

  // Bins: days = pickup days (0=Sun … 6=Sat). Put them out the evening before.
  garbage: {

      fr: "TODO: où sont les poubelles de l'immeuble et à quelle heure les descendre."

        what: { en: "Everything that isn't recyclable", fr: "Tout ce qui ne se recycle pas" } },
      { emoji: "♻️", name: { en: "Recycling", fr: "Recyclage" }, color: "var(--soft-mustard)", days: [3],
        what: { en: "Plastic, cans, cartons", fr: "Plastique, canettes, briques" } },
      { emoji: "📦", name: { en: "Paper", fr: "Papier" }, color: "var(--soft-sky)", days: [1],
        what: { en: "Flatten the boxes, please", fr: "Aplatissez les cartons, s'il vous plaît" } },
      { emoji: "🍂", name: { en: "Organic", fr: "Biodéchets" }, color: "var(--soft-sage)", days: [4],
        what: { en: "Food scraps (not cat litter!)", fr: "Restes alimentaires (pas la litière !)" } }
    ]
  },

  contacts: [
    { name: "TODO: Host 1", role: { en: "Owner", fr: "Propriétaire" }, phone: "TODO: +00 000 000 000" },
    { name: "TODO: Host 2", role: { en: "Owner", fr: "Propriétaire" }, phone: "TODO: +00 000 000 000" },
    { name: { en: "TODO: neighbor / friend nearby", fr: "TODO: voisin·e / ami·e proche" }, role: { en: "Has a spare key", fr: "A un double des clés" }, phone: "TODO: +00 000 000 000" },
    { name: { en: "Emergency", fr: "Urgences" }, role: { en: "Police, fire, ambulance", fr: "Police, pompiers, SAMU" }, phone: "112" }
  ]
};
/* ===================== end of things to edit ===================== */

/* Interface text (buttons, headings, live messages) */
const UI = {

    locale: "en-GB",
    greet: ["Good morning & welcome! 👋", "Good afternoon & welcome! 👋", "Good evening & welcome! 👋"],
    todayTitle: "Today at home",
    theme: "🌓 Switch light / dark",
    days: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],
    daysLong: ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
    today: "Today", tomorrow: "Tomorrow", and: " & ",
    dur: m => m < 60 ? `${m} min` : `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`,
    labels: { wifi: "Wi-Fi", plants: "Plants", garbage: "Garbage", supplies: "Supplies", cleaning: "Cleaning", home: "Apartment", contacts: "Contacts" },
    catTitle: n => `${n} the cat`,
    sub: {
      wifi: "Tap to copy", molly: "Meals, daily routine and house rules",

    },
    network: "Network", password: "Password", copy: "Copy", copied: "Copied! 📋", copyFail: "Couldn't copy, please type it in",
    feeding: "🍽️ Feeding times", checklist: n => `✅ ${n}'s checklist for today`, whereHer: "📍 Where her things are",
    dont: "🚫 Please don't", vet: "🩺 Vet:", next: d => `next · in ${d}`,
    weekly: "🗓️ Once a week", beforeGo: "👋 Before you leave",

    progress: (d, n) => d === n ? "All done, thank you! 🎉" : `${d} of ${n} done`,
    liveMeal: (n, l, t) => `${n}'s next meal: ${l} at ${t}`, liveIn: d => `in ${d}`,
    tonight: b => `Tonight: take out the ${b}`, pickupTomorrow: "Pickup is tomorrow",
    pickupToday: b => `Pickup today: ${b}`, stillTime: "If it's still early, there's time!",
    water: p => `Water today: ${p}`, waterTap: "Tap Plants for details",
    noWater: "No plants to water today", dayOff: "Enjoy the day off",
    liveCheck: (n, d, t) => `${n}'s checklist: ${d} of ${t} done`, purrfect: "Purrfect 🎉", tickOff: "Tick things off as you go",
    meow: "Meow! 🐾", thanks: n => `${n} says thank you! 🐾`
  },
  fr: {

    todayTitle: "Aujourd'hui à la maison",
    theme: "🌓 Mode clair / sombre",
    days: ["dim", "lun", "mar", "mer", "jeu", "ven", "sam"],
    daysLong: ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"],
    today: "Aujourd'hui", tomorrow: "Demain", and: " et ",
    dur: m => m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}`,
    labels: { wifi: "Wi-Fi", plants: "Plantes", garbage: "Poubelles", supplies: "Rangements", cleaning: "Ménage", home: "Appartement", contacts: "Contacts" },
    catTitle: n => `${n}, notre minette`,
    sub: {
      wifi: "Touchez pour copier", molly: "Repas, routine et règles de la maison",
      plants: d => `Jours en vert = jours d'arrosage. Aujourd'hui, c'est ${d}.`,
      garbage: "Sortez les poubelles la veille au soir du ramassage", supplies: "Où trouver les choses",
      cleaning: "Pour que tout reste agréable", home: "Les infos pratiques", contacts: "Appelez ou écrivez-nous quand vous voulez"
    },
    network: "Réseau", password: "Mot de passe", copy: "Copier", copied: "Copié ! 📋", copyFail: "Copie impossible, tapez-le à la main",
    feeding: "🍽️ Heures des repas", checklist: n => `✅ La liste de ${n} pour aujourd'hui`, whereHer: "📍 Où sont ses affaires",
    dont: "🚫 À éviter", vet: "🩺 Vétérinaire :", next: d => `prochain · dans ${d}`,
    weekly: "🗓️ Une fois par semaine", beforeGo: "👋 Avant de partir",
    address: "Adresse", goodToKnow: "💡 Bon à savoir", call: "Appeler",
    progress: (d, n) => d === n ? "Tout est fait, merci ! 🎉" : `${d} sur ${n} fait${d > 1 ? "s" : ""}`,
    liveMeal: (n, l, t) => `Prochain repas de ${n} : ${l.toLowerCase()} à ${t.replace(":", "h")}`, liveIn: d => `dans ${d}`,
    tonight: b => `Ce soir, à sortir : ${b}`, pickupTomorrow: "Ramassage demain",
    pickupToday: b => `Ramassage aujourd'hui : ${b}`, stillTime: "S'il est encore tôt, il est encore temps !",
    water: p => `À arroser aujourd'hui : ${p}`, waterTap: "Voir Plantes pour les détails",
    noWater: "Pas d'arrosage aujourd'hui", dayOff: "Profitez de la journée",
    liveCheck: (n, d, t) => `Liste de ${n} : ${d} sur ${t}`, purrfect: "Parfait, ronron 🎉", tickOff: "Cochez au fur et à mesure",
    meow: "Miaou ! 🐾", thanks: n => `${n} vous dit merci ! 🐾`
  }
};

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

let lang = store.get("lang") || ((navigator.language || "").toLowerCase().startsWith("fr") ? "fr" : "en");
const U = () => UI[lang];
// Pick the current language from a { en, fr } value; plain strings pass through
const L = v => (v && typeof v === "object") ? (v[lang] ?? v.en) : v;

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Translate, escape, and highlight anything still marked TODO
const t = raw => {
  const s = String(L(raw)), v = esc(s);
  return /^TODO/.test(s) ? `<span class="todo">✏️ ${v.replace(/^TODO:?\s*/, "")}</span>`
    : v.replace(/TODO:?\s*([^.]*)/g, '<span class="todo">✏️ $1</span>');
};
const plain = raw => String(L(raw)).replace(/^TODO:?\s*/, "");
const toast = msg => {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 1600);
};
const toMin = hhmm => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const daysUntil = days => {
  const today = new Date().getDay();
  return Math.min(...days.map(d => (d - today + 7) % 7));
};
const whenLabel = n => n === 0 ? U().today : n === 1 ? U().tomorrow : U().daysLong[(new Date().getDay() + n) % 7];
const todayKey = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };

const SECTIONS = [
  { id: "wifi", emoji: "📶", tone: "sky" },
  { id: "molly", emoji: "🐱", tone: "terracotta" },
  { id: "plants", emoji: "🌿", tone: "sage" },
  { id: "garbage", emoji: "🗑️", tone: "plum" },
  { id: "supplies", emoji: "🧴", tone: "mustard" },
  { id: "cleaning", emoji: "🧹", tone: "sky" },
  { id: "home", emoji: "🏠", tone: "terracotta" },
  { id: "contacts", emoji: "📞", tone: "sage" }
];
const label = s => s.id === "molly" ? HOME.cat.name : U().labels[s.id];

function sectionShell(s, subtitle, body) {
  const title = s.id === "molly" ? U().catTitle(HOME.cat.name) : label(s);
  return `<section class="card t-${s.tone}" id="${s.id}">
    <div class="sec-head"><div class="badge">${s.emoji}</div>
      <div><h2>${esc(title)}</h2><p>${esc(subtitle)}</p></div></div>
    ${body}</section>`;
}

function renderChecklist(id, items) {
  const key = `check:${id}:${id === "cat" ? todayKey() : "all"}`;
  const saved = store.get(key) || [];
  return `<ul class="check" data-key="${key}" data-id="${id}">${items.map((it, i) =>
    `<li><label><input type="checkbox" data-i="${i}" ${saved.includes(i) ? "checked" : ""}><span>${t(it)}</span></label></li>`).join("")}</ul>
    <div class="progress"><div id="prog-${id}"></div></div><div class="progress-txt" id="progt-${id}"></div>`;
}

function render() {
  const H = HOME, C = H.cat, S = Object.fromEntries(SECTIONS.map(s => [s.id, s])), u = U();
  document.documentElement.lang = lang;
  const hour = new Date().getHours();
  document.getElementById("greeting").textContent = u.greet[hour < 12 ? 0 : hour < 18 ? 1 : 2];
  document.getElementById("title").textContent = L(H.title);
  document.getElementById("intro").textContent = L(H.intro);
  document.getElementById("today-title").textContent = u.todayTitle;
  document.getElementById("theme-btn").textContent = u.theme;
  document.getElementById("signoff").innerHTML = `${esc(L(H.signoff))}<br>${t(H.hosts)}`;
  document.querySelectorAll("#lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  document.getElementById("nav").innerHTML = SECTIONS.map(s => `<a href="#${s.id}">${s.emoji} ${esc(label(s))}</a>`).join("");
  document.getElementById("tiles").innerHTML = SECTIONS.map(s =>
    `<a class="tile" href="#${s.id}"><span class="e">${s.emoji}</span><span>${esc(label(s))}</span></a>`).join("");

  const today = new Date().getDay();
  const out = [];

  out.push(sectionShell(S.wifi, u.sub.wifi, `
    <div class="wifi">
      <div class="wifi-row"><div><div class="lbl">${u.network}</div><div class="val">${t(H.wifi.network)}</div></div>
        <button type="button" data-copy="${esc(H.wifi.network)}">${u.copy}</button></div>
      <div class="wifi-row"><div><div class="lbl">${u.password}</div><div class="val">${t(H.wifi.password)}</div></div>
        <button type="button" data-copy="${esc(H.wifi.password)}">${u.copy}</button></div>
    </div>
    <p class="note">${t(H.wifi.note)}</p>`));

  out.push(sectionShell(S.molly, u.sub.molly, `
    <p>${t(C.about)}</p>
    <h3>${u.feeding}</h3>
    <div class="meals" id="meals"></div>
    <h3>${esc(u.checklist(C.name))}</h3>
    ${renderChecklist("cat", C.daily)}
    <h3>${u.whereHer}</h3>
    <dl class="kv">${C.where.map(([k, v]) => `<dt>${esc(L(k))}</dt><dd>${t(v)}</dd>`).join("")}</dl>
    <h3>${u.dont}</h3>
    <ul class="list">${C.dont.map(d => `<li>${t(d)}</li>`).join("")}</ul>
    <div class="note warn"><b>${u.vet}</b> ${t(C.vet.name)} · ${t(C.vet.phone)}<br>${t(C.vet.address)}</div>`));

  out.push(sectionShell(S.plants, u.sub.plants(u.daysLong[today]), `
    <div class="grid">${H.plants.map(p => `
      <div class="mini"><div class="e">${p.emoji}</div><b>${t(p.name)}</b><p>📍 ${t(p.where)}</p><p>${t(p.tip)}</p>
        <div class="chips">${[1,2,3,4,5,6,0].map(d => `<span class="chip ${p.water.includes(d) ? "on" : ""}" ${d === today ? 'style="outline:2px solid var(--ink)"' : ""}>${u.days[d]}</span>`).join("")}</div>
      </div>`).join("")}</div>
    <p class="note">${t(H.plantsNote)}</p>`));

  const bins = H.garbage.bins.map(b => ({ ...b, n: daysUntil(b.days) })).sort((a, b) => a.n - b.n);
  out.push(sectionShell(S.garbage, u.sub.garbage, `
    <div class="bins">${bins.map(b => `
      <div class="bin ${b.n <= 1 ? "soon" : ""}"><div class="dot" style="background:${b.color}">${b.emoji}</div>
        <div><b>${esc(L(b.name))}</b><div style="color:var(--muted);font-size:14px">${t(b.what)}</div></div>
        <div class="when">${esc(whenLabel(b.n))}<small>${b.days.map(d => u.days[d]).join(u.and)}</small></div></div>`).join("")}</div>
    <p class="note">${t(H.garbage.note)}</p>`));

  out.push(sectionShell(S.supplies, u.sub.supplies, `
    <div class="grid">${H.supplies.map(s => `<div class="mini"><div class="e">${s.emoji}</div><b>${esc(L(s.name))}</b><p>📍 ${t(s.where)}</p></div>`).join("")}</div>`));

  out.push(sectionShell(S.cleaning, u.sub.cleaning, `
    <h3>${u.weekly}</h3>
    <ul class="list">${H.cleaning.weekly.map(i => `<li>${t(i)}</li>`).join("")}</ul>
    <h3>${u.beforeGo}</h3>
    ${renderChecklist("leave", H.cleaning.beforeYouGo)}`));

  out.push(sectionShell(S.home, u.sub.home, `
    <dl class="kv"><dt>${u.address}</dt><dd>${t(H.apartment.address)}</dd>
      ${H.apartment.details.map(([k, v]) => `<dt>${esc(L(k))}</dt><dd>${t(v)}</dd>`).join("")}</dl>
    <h3>${u.goodToKnow}</h3>
    <ul class="list">${H.apartment.tips.map(i => `<li>${t(i)}</li>`).join("")}</ul>`));

  out.push(sectionShell(S.contacts, u.sub.contacts, H.contacts.map(c => {
    const tel = /^TODO/.test(c.phone) ? "" : c.phone.replace(/[^\d+]/g, "");
    return `<div class="contact"><div><b>${t(c.name)}</b><small>${esc(L(c.role))} · ${t(c.phone)}</small></div>
      ${tel ? `<a class="btn" href="tel:${esc(tel)}">${u.call}</a>` : ""}</div>`;
  }).join("")));

  document.getElementById("sections").innerHTML = out.join("");
  updateLive();
  ["cat", "leave"].forEach(updateProgress);
}

function updateProgress(id) {
  const ul = document.querySelector(`.check[data-id="${id}"]`);
  if (!ul) return;
  const boxes = [...ul.querySelectorAll("input")], done = boxes.filter(b => b.checked).length;
  document.getElementById(`prog-${id}`).style.width = `${(done / boxes.length) * 100}%`;
  document.getElementById(`progt-${id}`).textContent = U().progress(done, boxes.length);
}

// Things that depend on the clock: next meal, today panel
function updateLive() {
  const H = HOME, C = H.cat, u = U(), now = nowMin(), today = new Date().getDay();
  const meals = C.meals.map(m => ({ ...m, min: toMin(m.time) })).sort((a, b) => a.min - b.min);
  const next = meals.find(m => m.min > now) || meals[0];
  const until = next.min > now ? next.min - now : next.min + 1440 - now;

  const mealsEl = document.getElementById("meals");
  if (mealsEl) mealsEl.innerHTML = meals.map(m => `
    <div class="meal ${m === next ? "next" : ""}"><div class="time">${esc(m.time)}</div>
      <div><b>${esc(L(m.label))}${m === next ? `<span class="pill">${esc(u.next(u.dur(until)))}</span>` : ""}</b>
      <div class="what">${t(m.what)}</div></div></div>`).join("");

  document.getElementById("today-date").textContent =
    new Date().toLocaleDateString(u.locale, { weekday: "long", day: "numeric", month: "long" });

  const items = [];
  items.push(["🐱", u.liveMeal(C.name, L(next.label), next.time), u.liveIn(u.dur(until))]);

  const binNames = list => list.map(b => L(b.name).toLowerCase()).join(u.and);
  const binsToday = H.garbage.bins.filter(b => b.days.includes(today));
  const binsTomorrow = H.garbage.bins.filter(b => b.days.includes((today + 1) % 7));
  if (binsTomorrow.length) items.push(["🌙", u.tonight(binNames(binsTomorrow)), u.pickupTomorrow]);
  if (binsToday.length) items.push(["🚛", u.pickupToday(binNames(binsToday)), u.stillTime]);

  const thirsty = H.plants.filter(p => p.water.includes(today));
  items.push(thirsty.length
    ? ["💧", u.water(thirsty.map(p => plain(p.name)).join(", ")), u.waterTap]
    : ["🌿", u.noWater, u.dayOff]);

  const done = (store.get(`check:cat:${todayKey()}`) || []).length;
  items.push(["✅", u.liveCheck(C.name, done, C.daily.length), done === C.daily.length ? u.purrfect : u.tickOff]);

  document.getElementById("today-list").innerHTML = items.map(([e, b, s]) =>
    `<li><span class="e">${e}</span><div><b>${esc(b)}</b><span class="s">${esc(s)}</span></div></li>`).join("");
}

document.addEventListener("click", async e => {
  const langBtn = e.target.closest("#lang button");
  if (langBtn) { lang = langBtn.dataset.lang; store.set("lang", lang); render(); return; }
  const btn = e.target.closest("[data-copy]");
  if (!btn) return;
  try { await navigator.clipboard.writeText(btn.dataset.copy); toast(U().copied); }
  catch (err) { toast(U().copyFail); }
});

document.addEventListener("change", e => {
  const ul = e.target.closest(".check");
  if (!ul) return;
  const checked = [...ul.querySelectorAll("input")].filter(b => b.checked).map(b => +b.dataset.i);
  store.set(ul.dataset.key, checked);
  updateProgress(ul.dataset.id);
  updateLive();
  if (e.target.checked && ul.dataset.id === "cat") toast(checked.length === HOME.cat.daily.length ? U().thanks(HOME.cat.name) : U().meow);
});

const themeBtn = document.getElementById("theme-btn");
const savedTheme = store.get("theme");
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
themeBtn.addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = dark ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  store.set("theme", next);
});

render();
setInterval(updateLive, 60 * 1000);
</script>
</body>
